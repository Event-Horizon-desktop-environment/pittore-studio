name: Linux packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish stable release using version from meson.build'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  MESON_OPTS: -Dbuildtype=release --prefix=/usr -Dbackend-cuda=enabled -Dcuda-archs=sm_75,sm_80,sm_86,sm_89,sm_90,sm_100,sm_120,+ptx -Dbackend-hip=enabled -Dhip-archs=gfx906,gfx908,gfx90a,gfx942,gfx950,gfx1010,gfx1012,gfx1030,gfx1031,gfx1032,gfx1100,gfx1101,gfx1102,gfx1103,gfx1150,gfx1151,gfx1200,gfx1201 -Donnxruntime=disabled -Dapp=enabled

jobs:
  test:
    name: build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build git pkg-config \
            zlib1g-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev \
            libtomlplusplus-dev liblcms2-dev \
            qt6-base-dev libqt6svg6-dev \
            libwebp-dev libtiff-dev libjpeg-dev libzstd-dev libqrencode-dev
      - name: Install CUDA toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: nvcc compiles our kernels here; the binary
          # links cudart statically, so users need just the NVIDIA driver.
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install ROCm HIP toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: hipcc compiles our kernels here; the backend
          # ships as a plugin dlopened at runtime, so users install the
          # small hip-runtime-amd package instead of any toolkit.
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu's universe carries an older ROCm whose hipcc (5.7.1)
          # outranks AMD's (1.1.1) by version number; without this apt
          # mixes the two stacks and the old compiler rejects new GPU
          # targets. Pin AMD's repo above everything for a coherent 7.2.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update -qq
          sudo apt-get install -y -qq hip-dev
          echo "$(dirname "$(dpkg -L hipcc | grep 'bin/hipcc$' | head -1)")" >> "$GITHUB_PATH"
          # UI tests enumerate installed font families (type-tool-ui needs
          # >100); a bare runner ships only a handful, so install Noto's
          # per-script families plus the usual core sets.
          sudo apt-get install -y fonts-dejavu-core fonts-liberation2 \
            fonts-noto-core fonts-noto-mono fonts-noto-extra
          fc-cache -f
      - name: Configure
        run: meson setup build ${{ env.MESON_OPTS }}
      - name: Build
        run: |
          set -euo pipefail
          n=$(nproc)
          j=$(awk '/MemAvailable/{print int($2/3072000)}' /proc/meminfo)
          [ "${j:-0}" -lt 1 ] && j=1
          [ "$j" -gt "$n" ] && j=$n
          echo "Building with -j$j"
          ninja -C build -j"$j"
      # Tests are disabled in CI: the full meson suite (notably the heavy
      # UI cases like tools-ux) times out on hosted runners. They still run
      # locally via `just test`, which stays the pre-merge gate.

  deb:
    name: deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build git pkg-config \
            zlib1g-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev \
            libtomlplusplus-dev liblcms2-dev \
            qt6-base-dev libqt6svg6-dev \
            libwebp-dev libtiff-dev libjpeg-dev libzstd-dev libqrencode-dev
      - name: Install CUDA toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: nvcc compiles our kernels here; the binary
          # links cudart statically, so users need just the NVIDIA driver.
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install ROCm HIP toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: hipcc compiles our kernels here; the backend
          # ships as a plugin dlopened at runtime, so users install the
          # small hip-runtime-amd package instead of any toolkit.
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu's universe carries an older ROCm whose hipcc (5.7.1)
          # outranks AMD's (1.1.1) by version number; without this apt
          # mixes the two stacks and the old compiler rejects new GPU
          # targets. Pin AMD's repo above everything for a coherent 7.2.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update -qq
          sudo apt-get install -y -qq hip-dev
          echo "$(dirname "$(dpkg -L hipcc | grep 'bin/hipcc$' | head -1)")" >> "$GITHUB_PATH"
      - name: Build and stage
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          meson setup build ${{ env.MESON_OPTS }}
          n=$(nproc)
          j=$(awk '/MemAvailable/{print int($2/3072000)}' /proc/meminfo)
          [ "${j:-0}" -lt 1 ] && j=1
          [ "$j" -gt "$n" ] && j=$n
          ninja -C build -j"$j" src/app/painter src/app/pittore-mcp src/engine/compute/libpittore-hip.so
          rm -rf staging dist
          mkdir -p staging dist
          DESTDIR="$PWD/staging" meson install -C build --no-rebuild
          mkdir -p staging/DEBIAN
          cat > staging/DEBIAN/control <<EOF
          Package: pittore-studio
          Version: $VERSION
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Pittore Studio <noreply@example.com>
          Description: Layer-based photo editor for Linux
           Raster painting and retouching, vector persona, text,
           adjustment layers, filters, and an ICC-aware colour pipeline.
          Depends: libc6, libstdc++6, libqt6widgets6, libqt6network6, libqt6svg6, zlib1g, libharfbuzz0b, libfreetype6, libfontconfig1, liblcms2-2, libwebp7, libtiff6, libjpeg-turbo8, libzstd1, libqrencode4, libtomlplusplus3t64
          Recommends: hip-runtime-amd
          EOF
      - name: Pack deb
        run: |
          set -euo pipefail
          dpkg-deb --build staging "dist/pittore-studio_${VERSION}_amd64.deb"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: rpm (Fedora 44)
    runs-on: ubuntu-24.04
    needs: test
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          set -euo pipefail
          dnf -y install gcc-c++ meson ninja-build git pkgconf rpm-build tar gzip \
            zlib-ng-compat-devel harfbuzz-devel freetype-devel fontconfig-devel \
            tomlplusplus-devel lcms2-devel \
            qt6-qtbase-devel qt6-qtsvg-devel \
            libwebp-devel libtiff-devel libjpeg-turbo-devel libzstd-devel \
            qrencode-devel
      - name: Install CUDA toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: nvcc compiles our kernels here; the binary
          # links cudart statically, so users need just the NVIDIA driver.
          # NVIDIA's own fedora44 network repo (documented in the CUDA
          # install guide); CUDA 13.4 covers Fedora 44's GCC 16.
          dnf config-manager addrepo --from-repofile=https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64/cuda-fedora44.repo
          dnf -y install cuda-nvcc-13-4 cuda-cudart-devel-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install ROCm HIP toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only (same plugin story as the CUDA step above).
          # AMD's el9 network repo; the el8-tagged RPMs install fine in
          # the Fedora container. gpgcheck is off: this repo content never
          # ships, only our compiled kernels do.
          cat > /etc/yum.repos.d/rocm.repo <<EOF
          [rocm]
          name=AMD ROCm 7.2
          baseurl=https://repo.radeon.com/rocm/el9/7.2/main
          enabled=1
          gpgcheck=0
          EOF
          dnf -y install hipcc hip-devel hip-runtime-amd
          echo "$(dirname "$(rpm -ql hipcc | grep 'bin/hipcc$' | head -1)")" >> "$GITHUB_PATH"
      - name: Build and pack rpm
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          sed -e "s/^Version:.*/Version:        $VERSION/" packaging/rpm/pittore-studio.spec > rpmbuild/SPECS/pittore-studio.spec
          # rpmbuild %prep expects a source tarball; pack the checked-out
          # tree (no git dependency: there may be no repo inside the
          # container) so tag and non-tag runs build the same commit.
          tar -czf "rpmbuild/SOURCES/pittore-studio-$VERSION.tar.gz" \
            --transform "s,^,pittore-studio-$VERSION/," \
            --exclude=./build --exclude=./rpmbuild --exclude=./dist \
            --exclude=./.git .
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "_version $VERSION" rpmbuild/SPECS/pittore-studio.spec
          cp rpmbuild/RPMS/x86_64/*.rpm dist/
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: pacman package (Arch)
    runs-on: ubuntu-24.04
    needs: test
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Build pacman package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel meson ninja git pkgconf sudo \
            zlib harfbuzz freetype2 fontconfig tomlplusplus lcms2 \
            qt6-base qt6-svg \
            libwebp libtiff libjpeg-turbo zstd qrencode \
            cuda hip-runtime-amd
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          mkdir -p pkgwork dist
          cp packaging/arch/PKGBUILD pkgwork/
          # The PKGBUILD points at the release tarball; pre-place an archive
          # of this revision (no git dependency: there may be no repo
          # inside the container) so makepkg builds this commit offline.
          tar -czf "pkgwork/pittore-studio-$VERSION.tar.gz" \
            --transform "s,^,pittore-studio-$VERSION/," \
            --exclude=./build --exclude=./pkgwork --exclude=./dist \
            --exclude=./.git .
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" pkgwork/PKGBUILD
          chown -R builder:builder "$PWD"
          cd pkgwork
          sudo -u builder makepkg --syncdeps --noconfirm --needed
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  tarball:
    name: portable tarball
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build git pkg-config \
            zlib1g-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev \
            libtomlplusplus-dev liblcms2-dev \
            qt6-base-dev libqt6svg6-dev \
            libwebp-dev libtiff-dev libjpeg-dev libzstd-dev libqrencode-dev
      - name: Install CUDA toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: nvcc compiles our kernels here; the binary
          # links cudart statically, so users need just the NVIDIA driver.
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install ROCm HIP toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: hipcc compiles our kernels here; the backend
          # ships as a plugin dlopened at runtime, so users install the
          # small hip-runtime-amd package instead of any toolkit.
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu's universe carries an older ROCm whose hipcc (5.7.1)
          # outranks AMD's (1.1.1) by version number; without this apt
          # mixes the two stacks and the old compiler rejects new GPU
          # targets. Pin AMD's repo above everything for a coherent 7.2.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update -qq
          sudo apt-get install -y -qq hip-dev
          echo "$(dirname "$(dpkg -L hipcc | grep 'bin/hipcc$' | head -1)")" >> "$GITHUB_PATH"
      - name: Build and pack tarball
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          meson setup build ${{ env.MESON_OPTS }}
          n=$(nproc)
          j=$(awk '/MemAvailable/{print int($2/3072000)}' /proc/meminfo)
          [ "${j:-0}" -lt 1 ] && j=1
          [ "$j" -gt "$n" ] && j=$n
          ninja -C build -j"$j" src/app/painter src/app/pittore-mcp src/engine/compute/libpittore-hip.so
          rm -rf staging dist
          mkdir -p staging dist
          DESTDIR="$PWD/staging" meson install -C build --no-rebuild
          tar -czf "dist/pittore-studio-${VERSION}-x86_64.tar.gz" -C staging usr
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: tarball
          path: dist/*.tar.gz

  appimage:
    name: AppImage (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build git pkg-config \
            file wget \
            zlib1g-dev libharfbuzz-dev libfreetype-dev libfontconfig-dev \
            libtomlplusplus-dev liblcms2-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-dev-tools \
            libwebp-dev libtiff-dev libjpeg-dev libzstd-dev libqrencode-dev
      - name: Install CUDA toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: nvcc compiles our kernels here; the binary
          # links cudart statically, so users need just the NVIDIA driver.
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-13-4 cuda-cudart-dev-13-4
          echo "/usr/local/cuda-13.4/bin" >> "$GITHUB_PATH"
      - name: Install ROCm HIP toolkit (build-only)
        run: |
          set -euo pipefail
          # Build-time only: hipcc compiles our kernels here; the backend
          # ships as a plugin dlopened at runtime, so users install the
          # small hip-runtime-amd package instead of any toolkit.
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.2 noble main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Ubuntu's universe carries an older ROCm whose hipcc (5.7.1)
          # outranks AMD's (1.1.1) by version number; without this apt
          # mixes the two stacks and the old compiler rejects new GPU
          # targets. Pin AMD's repo above everything for a coherent 7.2.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/rocm
          sudo apt-get update -qq
          sudo apt-get install -y -qq hip-dev
          echo "$(dirname "$(dpkg -L hipcc | grep 'bin/hipcc$' | head -1)")" >> "$GITHUB_PATH"
      - name: Build and pack AppImage
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          meson setup build ${{ env.MESON_OPTS }}
          n=$(nproc)
          j=$(awk '/MemAvailable/{print int($2/3072000)}' /proc/meminfo)
          [ "${j:-0}" -lt 1 ] && j=1
          [ "$j" -gt "$n" ] && j=$n
          ninja -C build -j"$j" src/app/painter src/app/pittore-mcp src/engine/compute/libpittore-hip.so
          rm -rf AppDir dist
          mkdir -p AppDir dist
          DESTDIR="$PWD/AppDir" meson install -C build --no-rebuild
          cp packaging/linux/studio.pittore.painter.desktop AppDir/studio.pittore.painter.desktop
          cp packaging/linux/icons/hicolor/scalable/apps/painter.svg AppDir/painter.svg
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/metainfo
          cp packaging/linux/studio.pittore.painter.desktop AppDir/usr/share/applications/
          cp packaging/linux/studio.pittore.painter.metainfo.xml AppDir/usr/share/metainfo/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            --desktop-file AppDir/studio.pittore.painter.desktop \
            --icon-file AppDir/painter.svg \
            --plugin qt \
            --output appimage
          mkdir -p dist
          mv Pittore*.AppImage "dist/pittore-studio-${VERSION}-x86_64.AppImage" 2>/dev/null || mv *.AppImage "dist/pittore-studio-${VERSION}-x86_64.AppImage"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Install flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.8 org.kde.Sdk//6.8
      - name: Build bundle
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          rm -rf flatpak-build repo dist
          mkdir -p dist
          flatpak-builder --force-clean --repo=repo flatpak-build packaging/flatpak/studio.pittore.painter.yml
          flatpak build-bundle repo "dist/pittore-studio-${VERSION}-x86_64.flatpak" studio.pittore.painter
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: flatpak
          path: dist/*.flatpak

  snap:
    name: Snap
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build snap
        # snapcore/action-build@v1 is still Node20 with no new tag;
        # pin to node24 PR head until upstream releases, or replace with direct snapcraft.
        uses: snapcore/action-build@edf78ca622b1eb99b69f09420bb19f77e4f84ac1
        with:
          snapcraft-channel: stable
      - name: Stage snap
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
          fi
          mkdir -p dist
          cp ./*.snap "dist/pittore-studio-${VERSION}-amd64.snap"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: snap
          path: dist/*.snap

  release:
    name: publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [deb, rpm, arch, tarball, appimage, flatpak, snap]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve version and ensure tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
            VERSION="${TAG#v}"
          else
            VERSION="$(grep -oP "^[[:space:]]*version\s*:\s*'\K[^']+" meson.build)"
            TAG="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release $TAG (version $VERSION)"
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "Tag $TAG already exists, reusing it."
            else
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/pittore-studio*
          fail_on_unmatched_files: true
          generate_release_notes: true

  release-latest:
    name: publish rolling release
    runs-on: ubuntu-24.04
    needs: [deb, rpm, arch, tarball, appimage, flatpak, snap]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Move rolling tag
        run: |
          git tag -f rolling ${{ github.sha }}
          git push -f origin rolling
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: Rolling build
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/pittore-studio*
          fail_on_unmatched_files: true
          generate_release_notes: true
